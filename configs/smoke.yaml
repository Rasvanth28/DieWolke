# Pipeline check on random data: runs on CPU in about a minute, no dataset needed.
base: base.yaml
name: smoke
data:
  fake: true
  fake_size: 64
  n_train: 24
  n_val: 8
  n_test: 8
  crop: 32
  max_target_cloud: null
model:
  base: 16
  sar_ch: 16
  heads: 2
train:
  out_dir: runs_smoke
  steps: 6
  batch: 4
  warmup: 2
  workers: 0
  log_every: 2
  val_every: 3
  val_batches: 1
  val_batch: 4
  amp: false
